<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Result College | WAEC / NECO Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:#f4f7f9}
.hero{text-align:center;background:#fff;padding:50px 20px;border-bottom:3px solid #0d6efd}
.hero img{width:120px;border-radius:50%}
.hero h1{color:#0d6efd;font-size:34px;margin:10px 0}
.hero h2{font-size:18px;color:#555}
.hero-btn{padding:15px 40px;background:#0d6efd;color:#fff;border:none;border-radius:50px;font-size:18px;cursor:pointer}

.modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
align-items:center;justify-content:center;z-index:9999
}
.modal .box{
background:#fff;padding:30px;max-width:720px;width:95%;
border-radius:15px;max-height:90vh;overflow:auto;text-align:center
}

label{font-weight:600;display:block;margin-top:15px;text-align:left}
input,select{width:100%;padding:12px;margin-top:5px;border-radius:8px;border:1px solid #ccc}

.hidden{display:none}
.btn{margin-top:20px;padding:14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-blue{background:#0d6efd;color:#fff}
.btn-green{background:#25d366;color:#fff}
.btn-gray{background:#6c757d;color:#fff}

.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:600px){.row{grid-template-columns:1fr}}

#countdown{margin-top:10px;font-weight:bold}
</style>
</head>

<body>

<header class="hero">
<img src="logo.jpg">
<h1>BETTER RESULT COLLEGE</h1>
<h2>WAEC / NECO Registration & Result Request Portal</h2>
<button class="hero-btn" onclick="openChoice()">Start</button>
</header>

<!-- SERVICE CHOICE MODAL -->
<div class="modal" id="choiceModal">
<div class="box">
<h3>Select Service</h3>
<button class="btn btn-blue" onclick="selectType('REGISTER')">WAEC / NECO Registration</button>
<button class="btn btn-green" onclick="selectType('REQUEST')">Result Request</button>
</div>
</div>

<!-- MAIN FORM MODAL -->
<div class="modal" id="mainModal">
<div class="box">

<h3 id="formTitle"></h3>

<form onsubmit="return false">

<div class="row">
<div><label>Surname</label><input id="surname" required></div>
<div><label>First Name</label><input id="firstname" required></div>
</div>

<label>Other Name</label>
<input id="othername">

<div class="row">
<div>
<label>Gender</label>
<select id="gender" required>
<option value="">Select</option><option>Male</option><option>Female</option>
</select>
</div>
<div>
<label>Date of Birth</label><input type="date" id="dob" required>
</div>
</div>

<label>Nationality</label><input id="nationality" value="Nigerian">

<div class="row">
<div><label>State of Origin</label><input id="state" required></div>
<div><label>LGA</label><input id="lga" required></div>
</div>

<label>Home Address</label><input id="address" required>

<div class="row">
<div><label>Phone Number</label><input id="phone" required></div>
<div><label>WhatsApp Number</label><input id="whatsapp" required></div>
</div>

<label>Email Address</label><input type="email" id="email">

<!-- REGISTRATION ONLY -->
<div class="registerOnly">
<hr>
<label>Exam Body</label>
<select id="examBody"><option>WAEC</option><option>NECO</option></select>

<label>Exam Type</label>
<select id="examType"><option>SSCE</option><option>GCE</option></select>

<label>Exam Diet</label>
<select id="examDiet"><option>May/June</option><option>Nov/Dec</option></select>

<label>Exam Year</label>
<select id="examYear"><option>2025</option><option>2026</option><option>2027</option></select>

<label>Candidate Type</label>
<select id="candidateType"><option>School</option><option>Private</option></select>

<label>Subjects (comma separated, max 9)</label>
<input id="subjects">
</div>

<!-- REQUEST ONLY -->
<div class="requestOnly hidden">
<hr>
<label>Exam Number</label><input id="examNumber">
<label>Purpose of Request</label><input id="purpose">
</div>

<button class="btn btn-blue" onclick="submitForm()">Submit</button>
<button class="btn btn-gray" onclick="closeAll()">Cancel</button>

</form>
</div>
</div>

<!-- AFTER DOWNLOAD MODAL -->
<div class="modal" id="afterModal">
<div class="box">
<h3>Download Complete</h3>
<p>
Your document has been downloaded successfully.<br><br>
<strong>Please open WhatsApp and attach the downloaded PDF</strong>
</p>
<p id="countdown">Opening WhatsApp in 10 seconds…</p>
<button class="btn btn-green" onclick="openWhatsApp()">Open WhatsApp Now</button>
</div>
</div>

<script>
let actionType="REGISTER";
let waLink="";
let timer=10;

function openChoice(){
choiceModal.style.display="flex";
}

function selectType(type){
actionType=type;
choiceModal.style.display="none";
mainModal.style.display="flex";

formTitle.innerText=
type==="REGISTER"?"WAEC / NECO Pre-Registration":"WAEC / NECO Result Request";

document.querySelector(".registerOnly").style.display=
type==="REGISTER"?"block":"none";
document.querySelector(".requestOnly").classList.toggle("hidden",type==="REGISTER");
}

function closeAll(){
choiceModal.style.display="none";
mainModal.style.display="none";
afterModal.style.display="none";
}

function submitForm(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();

const ref="BRC/"+Date.now().toString().slice(-6);

let data={
Service:actionType,
Reference:ref,
Name:`${surname.value} ${firstname.value} ${othername.value}`,
Gender:gender.value,
DOB:dob.value,
Nationality:nationality.value,
State:state.value,
LGA:lga.value,
Address:address.value,
Phone:phone.value,
WhatsApp:whatsapp.value,
Email:email.value||"N/A"
};

if(actionType==="REGISTER"){
Object.assign(data,{
ExamBody:examBody.value,
ExamType:examType.value,
ExamDiet:examDiet.value,
ExamYear:examYear.value,
CandidateType:candidateType.value,
Subjects:subjects.value
});
}else{
Object.assign(data,{
ExamNumber:examNumber.value,
Purpose:purpose.value
});
}

let y=20;
pdf.setFontSize(16);
pdf.text("BETTER RESULT COLLEGE",105,y,{align:"center"});
y+=15;
pdf.setFontSize(11);

Object.entries(data).forEach(([k,v])=>{
pdf.text(k+":",20,y);
pdf.text(String(v),70,y);
y+=7;
});

pdf.save(`${data.Name.replace(/\s+/g,"_")}_${actionType}.pdf`);

waLink=`https://wa.me/2349125802791?text=${encodeURIComponent(
Object.entries(data).map(([k,v])=>`${k}: ${v}`).join("\n")
)}`;

mainModal.style.display="none";
afterModal.style.display="flex";

timer=10;
countdown.innerText=`Opening WhatsApp in ${timer} seconds…`;

const interval=setInterval(()=>{
timer--;
countdown.innerText=`Opening WhatsApp in ${timer} seconds…`;
if(timer<=0){
clearInterval(interval);
openWhatsApp();
}
},1000);
}

function openWhatsApp(){
window.location.href=waLink;
}
</script>

</body>
</html>
