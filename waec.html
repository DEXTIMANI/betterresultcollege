<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Result College | Registration</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ===========================
       GLOBAL STYLES
    =========================== */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 0; background: #f4f7f9; color: #333;
    }
    
    /* ===========================
       HERO SECTION
    =========================== */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: white;
      padding: 50px 20px;
      border-bottom: 3px solid #0d6efd;
    }
    .hero .logo { max-width: 120px; height: auto; margin-bottom: 15px; border-radius: 50%; }
    .hero h1 { font-size: 36px; color: #0d6efd; margin: 0; font-weight: 800; }
    .hero h2 { font-size: 18px; color: #555; margin: 10px 0 25px 0; }
    .hero-btn {
      background: #0d6efd; color: white; border: none; padding: 15px 40px;
      font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3); transition: 0.3s;
    }
    .hero-btn:hover { transform: translateY(-3px); background: #0b5ed7; }
    .hero-img-container { margin-top: 30px; max-width: 500px; width: 90%; }
    .hero-img { width: 100%; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

    /* ===========================
       FORM STYLES
    =========================== */
    #regFormSection { display: none; padding: 40px 20px; }
    .form-container {
      max-width: 650px; margin: 0 auto; background: white;
      padding: 35px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    
    /* Progress Bar */
    #progressBarContainer {
      width: 100%; background: #e9ecef; height: 10px;
      border-radius: 10px; margin-bottom: 30px;
    }
    #progressBar {
      height: 100%; width: 0%; background: #0d6efd;
      border-radius: 10px; transition: width 0.4s ease;
    }

    .tab { display: none; }
    .tab h3 { border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 20px; }
    
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #444; }
    input, select {
      width: 100%; padding: 12px; margin-bottom: 20px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box;
    }
    input:focus { border-color: #0d6efd; outline: none; box-shadow: 0 0 8px rgba(13,110,253,0.2); }
    .invalid { border: 2px solid #dc3545 !important; background-color: #fff8f8; }

    /* Review Table */
    .review-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .review-table td { padding: 10px; border-bottom: 1px solid #eee; }
    .review-table td:first-child { font-weight: bold; color: #0d6efd; width: 40%; }

    .step-buttons { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; }
    .btn-nav { flex: 1; padding: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
    #prevBtn { background: #6c757d; color: white; }
    #nextBtn { background: #0d6efd; color: white; }

    #previewImg { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 2px solid #0d6efd; display: none; margin: 10px 0; }
  </style>
</head>
<body>

<header class="hero" id="hero">
  <img src="images/logo.jpg" class="logo" alt="Better Result College Logo">
  <h1>BETTER RESULT COLLEGE</h1>
  <h2>Request WAEC/NECO Result</h2>
  <button id="startBtn" class="hero-btn">Start Request Now</button>
  <div class="hero-img-container">
    <img src="images/reg.jpg" class="hero-img" alt="Registration Portal">
  </div>
</header>

<section id="regFormSection">
  <div class="form-container">
    <div id="progressBarContainer"><div id="progressBar"></div></div>

    <form id="regForm">
      <div class="tab">
        <h3>Step 1: Personal Profile</h3>
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Surname Firstname" required>
        <label>Date of Birth</label>
        <input type="date" id="dob" required>
        <label>Gender</label>
        <select id="gender" required>
          <option value="">-- Select --</option>
          <option>Male</option>
          <option>Female</option>
        </select>
        <label>Active Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. +2349125802791" required>
      </div>

      <div class="tab">
        <h3>Step 2: Contact Details</h3>
        <label>Residential Address</label>
        <input type="text" id="address" placeholder="Current Home Address" required>
        <label>State of Origin</label>
        <input type="text" id="state" placeholder="State" required>
        <label>Local Govt Area (LGA)</label>
        <input type="text" id="lga" placeholder="LGA" required>
      </div>

      <div class="tab">
        <h3>Step 3: Academic Information</h3>
        <label>Year of Examination</label>
        <select id="examYear" required>
            <option value="">-- Select Year --</option>
            <option>2025</option>
            <option>2026</option>
            <option>2027</option>
        </select>
        <label>Target Class</label>
        <select id="studentClass" required>
          <option value="">-- Select Class --</option>
          <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
          <option>SS 1</option><option>SS 2</option><option>SS 3</option>
        </select>
        <label>Preferred Department</label>
        <select id="course" required>
          <option value="">-- Select Department --</option>
          <option>Science</option>
          <option>Arts</option>
          <option>Commercial</option>
        </select>
        <label>WAEC Exam Number (If applicable)</label>
        <input type="text" id="waecNumber" placeholder="Enter Number or 'N/A'">
      </div>

      <div class="tab">
        <h3>Step 4: Documents</h3>
        <label>Upload Passport Photograph</label>
        <input type="file" id="passport" accept="image/*" required>
        <center><img id="previewImg" src=""></center>
      </div>

      <div class="tab">
        <h3>Step 5: Review & Submit</h3>
        <p>Confirm your details. Your data will be sent to the school office via WhatsApp.</p>
        <div id="reviewData"></div>
      </div>

      <div class="step-buttons">
        <button type="button" class="btn-nav" id="prevBtn" onclick="nextPrev(-1)">Back</button>
        <button type="button" class="btn-nav" id="nextBtn" onclick="nextPrev(1)">Next</button>
      </div>
    </form>
  </div>
</section>

<script>
let currentTab = 0;
const tabs = document.getElementsByClassName("tab");

document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("hero").style.display = "none";
  document.getElementById("regFormSection").style.display = "block";
  showTab(currentTab);
});

function showTab(n) {
  tabs[n].style.display = "block";
  document.getElementById("prevBtn").style.display = (n == 0) ? "none" : "inline";
  document.getElementById("nextBtn").innerHTML = (n == (tabs.length - 1)) ? "Final Submit" : "Next";
  
  let pct = ((n + 1) / tabs.length) * 100;
  document.getElementById("progressBar").style.width = pct + "%";

  if (n === tabs.length - 1) populateReview();
}

function nextPrev(n) {
  if (n == 1 && !validateForm()) return false;
  tabs[currentTab].style.display = "none";
  currentTab = currentTab + n;
  if (currentTab >= tabs.length) {
    generatePDF();
    return false;
  }
  showTab(currentTab);
}

function validateForm() {
  let valid = true;
  let inputs = tabs[currentTab].querySelectorAll("input[required], select[required]");
  inputs.forEach(input => {
    if (!input.value) {
      input.classList.add("invalid");
      valid = false;
    } else {
      input.classList.remove("invalid");
    }
  });
  return valid;
}

document.getElementById("passport").addEventListener("change", function() {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = document.getElementById("previewImg");
    img.src = e.target.result;
    img.style.display = "block";
  };
  reader.readAsDataURL(this.files[0]);
});

function populateReview() {
  const fields = [
    { label: "Full Name", val: document.getElementById("name").value },
    { label: "Exam Year", val: document.getElementById("examYear").value },
    { label: "Class", val: document.getElementById("studentClass").value },
    { label: "Phone", val: document.getElementById("phone").value }
  ];
  let html = `<table class="review-table">`;
  fields.forEach(f => { html += `<tr><td>${f.label}</td><td>${f.val}</td></tr>`; });
  html += `</table>`;
  document.getElementById("reviewData").innerHTML = html;
}

async function generatePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const name = document.getElementById("name").value;
  const examYear = document.getElementById("examYear").value;

  doc.setFontSize(22); doc.setTextColor(13, 110, 253);
  doc.text("BETTER RESULT COLLEGE", 105, 20, { align: "center" });
  doc.setFontSize(14); doc.setTextColor(100);
  doc.text(`${examYear} Registration Slip`, 105, 30, { align: "center" });

  doc.setFontSize(12); doc.setTextColor(0);
  let y = 50;
  const data = [
    ["Full Name:", name],
    ["Exam Year:", examYear],
    ["Date of Birth:", document.getElementById("dob").value],
    ["Phone Number:", document.getElementById("phone").value],
    ["Address:", document.getElementById("address").value],
    ["Class Applied:", document.getElementById("studentClass").value],
    ["Department:", document.getElementById("course").value],
    ["WAEC No:", document.getElementById("waecNumber").value || "N/A"]
  ];
  
  data.forEach(row => {
    doc.text(row[0], 20, y);
    doc.text(row[1], 70, y);
    y += 10;
  });

  const imgData = document.getElementById("previewImg").src;
  if (imgData.startsWith("data:image")) doc.addImage(imgData, 'JPEG', 150, 45, 40, 40);

  doc.save(`${name.replace(/\s+/g, '_')}_Slip.pdf`);
  
  // WHATSAPP REDIRECT TO SPECIFIED NUMBER
  const schoolPhone = "2349125802791";
  const whatsappMsg = encodeURIComponent(
    `*NEW REGISTRATION: BETTER RESULT COLLEGE*\n\n` +
    `*Name:* ${name}\n` +
    `*Exam Year:* ${examYear}\n` +
    `*Class:* ${document.getElementById("studentClass").value}\n` +
    `*Phone:* ${document.getElementById("phone").value}\n\n` +
    `_The registration slip has been downloaded to my device._`
  );
  
  setTimeout(() => {
    window.location.href = `https://wa.me/${schoolPhone}?text=${whatsappMsg}`;
  }, 1500);
}
</script>

</body>
</html>
