<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Wizard</title>
  <link rel="stylesheet" href="stylereg.css">
</head>
<body>

<header class="hero">
  <img src="images/logo.jpg" class="logo" alt="Logo">
  <h1>School Admission Form</h1>
  <p>Register now to secure your space</p>
  <button id="startBtn" class="hero-btn">Start Registration</button>
  <img src="images/reg.jpg" class="hero-img" alt="Hero Image">
</header>

<section id="formSection" style="display:none;">
  <div class="form-container">
    <!-- Multi-Step Form -->
    <form id="regForm">
      
      <!-- STEP 1 -->
      <div class="tab">
        <h3>Personal Information</h3>
        <input placeholder="Full Name" id="name" required>
        <input placeholder="Phone Number" id="phone" required>
        <select id="gender" required>
          <option disabled selected value="">Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

      <!-- STEP 2 -->
      <div class="tab">
        <h3>Academics</h3>
        <select id="course" required>
          <option disabled selected value="">Preferred Course</option>
          <option>Science</option>
          <option>Arts</option>
          <option>Commercial</option>
        </select>
        <select id="state" required>
          <option disabled selected value="">State of Origin</option>
          <option>Lagos</option>
          <option>Rivers</option>
          <option>Abuja</option>
          <option>Kaduna</option>
        </select>
      </div>

      <!-- STEP 3 -->
      <div class="tab">
        <h3>Uploads</h3>
        <label>Passport Photo</label>
        <input type="file" id="passport" accept="image/*">
        <img id="previewImg" style="width:120px;margin-top:10px;display:none;">
      </div>

      <!-- Step Buttons -->
      <div style="overflow:auto;">
        <div style="float:right;">
          <button type="button" id="prevBtn" onclick="nextPrev(-1)">Previous</button>
          <button type="button" id="nextBtn" onclick="nextPrev(1)">Next</button>
        </div>
      </div>

    </form>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="scriptreg.js"></script>
</body>
</html>
