<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Result College | Registration Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--primary:#0d6efd;--green:#25d366;--bg:#f0f6ff}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg)}
.hero{text-align:center;padding:60px 20px;background:var(--primary);color:#fff}
.hero img.logo{width:180px;margin-bottom:20px}
.hero-img{max-width:500px;width:90%;margin-top:30px;border-radius:12px}
.hero-btn{padding:18px 45px;background:var(--green);border:none;border-radius:50px;font-size:18px;color:#fff;cursor:pointer}
#formSection{display:none;padding-bottom:60px}
.form-container{max-width:560px;margin:-40px auto;background:#fff;padding:30px;border-radius:15px}
.progress-container{height:8px;background:#e9ecef;border-radius:10px;margin-bottom:25px}
#progressBar{height:100%;width:0%;background:var(--primary);border-radius:10px}
.tab{display:none}
label{font-weight:bold;font-size:14px;margin-top:10px;display:block}
input,select{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #ccc}
.step-buttons{display:flex;margin-top:25px}
.btn{flex:1;padding:14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:0 5px}
#prevBtn{background:#6c757d;color:#fff}
#nextBtn{background:var(--primary);color:#fff}
#previewImg{width:120px;height:120px;object-fit:contain;border:2px solid var(--primary);border-radius:8px;display:none}
#instructionOverlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:9999;align-items:center;justify-content:center
}
#instructionOverlay .box{
  background:#fff;padding:25px;max-width:420px;width:90%;
  border-radius:12px;text-align:center
}
#instructionOverlay button{
  margin-top:15px;padding:12px 25px;
  background:#25d366;border:none;border-radius:6px;
  color:#fff;font-weight:bold;cursor:pointer
}
</style>
</head>

<body>

<header class="hero" id="hero">
  <img src="logo.jpg" class="logo">
  <h1>BETTER RESULT COLLEGE</h1>
  <p>Standardized Online Registration Portal</p>
  <button class="hero-btn" id="startBtn">Start Registration Now</button><br>
  <img src="reg.jpg" class="hero-img">
</header>

<section id="formSection">
<div class="form-container">
<div class="progress-container"><div id="progressBar"></div></div>

<form onsubmit="return false">

<div class="tab">
<h3>Personal Information</h3>
<label>Full Name</label><input id="name" required>
<label>Date of Birth</label><input type="date" id="dob" required>
<label>Gender</label>
<select id="gender" required>
<option disabled selected value="">Select</option>
<option>Male</option><option>Female</option>
</select>
<label>Phone</label><input id="phone" required>
<label>Email</label><input id="email">
</div>

<div class="tab">
<h3>Address</h3>
<label>Home Address</label><input id="address" required>
<label>State</label>
<select id="state" required>
<option disabled selected value="">Select State</option>
<option>Abia</option><option>Adamawa</option><option>Akwa Ibom</option>
<option>Anambra</option><option>Bauchi</option><option>Bayelsa</option>
<option>Benue</option><option>Borno</option><option>Cross River</option>
<option>Delta</option><option>Ebonyi</option><option>Edo</option>
<option>Ekiti</option><option>Enugu</option><option>Gombe</option>
<option>Imo</option><option>Jigawa</option><option>Kaduna</option>
<option>Kano</option><option>Katsina</option><option>Kebbi</option>
<option>Kogi</option><option>Kwara</option><option>Lagos</option>
<option>Nasarawa</option><option>Niger</option><option>Ogun</option>
<option>Ondo</option><option>Osun</option><option>Oyo</option>
<option>Plateau</option><option>Rivers</option><option>Sokoto</option>
<option>Taraba</option><option>Yobe</option><option>Zamfara</option>
<option>FCT - Abuja</option>
</select>
<label>LGA</label><input id="lga" required>
</div>

<div class="tab">
<h3>Academic Info</h3>
<label>Class</label>
<select id="studentClass" required>
<option disabled selected value="">Select</option>
<option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
<option>SSS 1</option><option>SSS 2</option><option>SSS 3</option>
</select>
<label>Program</label>
<select id="course" required>
<option disabled selected value="">Select</option>
<option>Science</option><option>Arts</option><option>Commercial</option>
</select>
</div>

<div class="tab">
<h3>Passport Upload</h3>
<input type="file" id="passport" accept="image/*" required>
<center><img id="previewImg"></center>
</div>

<div class="tab">
<h3>Final Step</h3>
<p style="text-align:center">
Submit to download your form. WhatsApp will open automatically.
</p>
</div>

<div class="step-buttons">
<button class="btn" id="prevBtn" onclick="nextPrev(-1)">Previous</button>
<button class="btn" id="nextBtn" onclick="nextPrev(1)">Next</button>
</div>

</form>
</div>
</section>

<div id="instructionOverlay">
<div class="box">
<h3>Registration Downloaded</h3>
<p>Please attach the downloaded PDF on WhatsApp.</p>
<p id="countdown"><strong>Opening in 12 seconds…</strong></p>
<button onclick="openWhatsAppNow()">Open WhatsApp Now</button>
</div>
</div>

<script>
let currentTab=0, passportData=null, countdown=12, waLink="";
const tabs=document.getElementsByClassName("tab");

startBtn.onclick=()=>{
hero.style.display="none";
formSection.style.display="block";
showTab(0);
};

function showTab(n){
tabs[n].style.display="block";
prevBtn.style.display=n===0?"none":"inline";
nextBtn.innerHTML=n===tabs.length-1?"Submit":"Next";
progressBar.style.width=((n+1)/tabs.length)*100+"%";
}

function nextPrev(n){
if(n===1&&!validate())return;
tabs[currentTab].style.display="none";
currentTab+=n;
if(currentTab>=tabs.length){generatePDF();return;}
showTab(currentTab);
}

function validate(){
let ok=true;
tabs[currentTab].querySelectorAll("input,select").forEach(i=>{
if(i.hasAttribute("required")&&!i.value){i.style.borderColor="red";ok=false;}
else i.style.borderColor="#ccc";
});
return ok;
}

passport.onchange=()=>{
const r=new FileReader();
r.onload=()=>{passportData=r.result;previewImg.src=r.result;previewImg.style.display="block";}
r.readAsDataURL(passport.files[0]);
};

function generatePDF(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF("p","mm","a4");

const regNo="BRC/2026/"+Math.floor(10000+Math.random()*90000);

const data={
"Registration No":regNo,
"Name":document.getElementById("name").value,
"DOB":document.getElementById("dob").value,
"Gender":document.getElementById("gender").value,
"Phone":document.getElementById("phone").value,
"Email":document.getElementById("email").value,
"Address":document.getElementById("address").value,
"State":document.getElementById("state").value,
"LGA":document.getElementById("lga").value,
"Class":document.getElementById("studentClass").value,
"Program":document.getElementById("course").value
};

pdf.setFontSize(16);
pdf.text("BETTER RESULT COLLEGE",105,20,{align:"center"});
pdf.line(20,24,190,24);

let y=35;
pdf.setFontSize(11);
Object.entries(data).forEach(([k,v])=>{
pdf.text(k+":",20,y);
pdf.text(String(v),70,y);
y+=7;
});

if(passportData){
pdf.addImage(passportData,"JPEG",150,35,35,35);
}

pdf.save(`${data.Name.replace(/\s+/g,"_")}_Registration.pdf`);

const msg=Object.entries(data).map(([k,v])=>`${k}: ${v}`).join("\n");
waLink=`https://wa.me/2347087079065?text=${encodeURIComponent(msg)}`;

instructionOverlay.style.display="flex";

const timer=setInterval(()=>{
countdown--;
document.getElementById("countdown").innerHTML=`<strong>Opening in ${countdown} seconds…</strong>`;
if(countdown<=0){
clearInterval(timer);
openWhatsAppNow();
}
},1000);
}

function openWhatsAppNow(){
window.location.href=waLink;
}
</script>

</body>
</html>
